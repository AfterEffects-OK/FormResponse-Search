<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title-tag">おさらいテスト 回答状況</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #0b0f19;
      margin: 0;
      padding: 6px;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .container {
      max-width: 1250px;
      width: 100%;
      margin: 0 auto;
      background: #111827;
      padding: 24px 12px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      border: 1px solid #1f2937;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .header-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 6px;
    }
    h1 {
      font-size: 1.1rem;
      margin: 0;
      color: #60a5fa;
      display: flex;
      flex-wrap: wrap;
      gap: 0;
    }
    .title-main {
      white-space: nowrap;
    }
    .title-date {
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .date-info {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .status-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 12px;
      background-color: #064e3b;
      color: #4ade80;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      border: 1px solid #065f46;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #22c55e;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .count-badge,
    .lecture-buttons-container {
      display: none !important;
    }

    .controls-container {
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      justify-content: center;
      margin-bottom: 4px;
    }

    .search-container {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      max-width: 400px;
    }

    .search-input {
      background-color: #1e293b;
      color: #f8fafc;
      border: 2px solid #3b82f6;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
    }
    .search-input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 15px rgba(96, 165, 250, 0.4);
    }
    .search-input::placeholder {
      color: #94a3b8;
    }

    .usage-hint {
      font-size: 0.75rem;
      color: #94a3b8;
      text-align: center;
      margin: 0 0 4px 0;
      letter-spacing: 0.02em;
    }

    .student-grid {
      display: grid;
      grid-template-rows: repeat(3, auto);
      grid-auto-flow: column;
      gap: 12px 6px;
      list-style: none;
      padding: 40px 12px;
      margin: 0;
      overflow-x: auto;
      align-content: start;
    }

    .student-item {
      background: #ffffff;
      padding: 4px 6px;
      border: 1.5px solid #ffffff;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      box-sizing: border-box;
      max-width: 200px;
      width: 100%;
      transition: border-color 0.3s ease;
      position: relative !important;
      overflow: visible !important;
      z-index: 1;
      cursor: pointer;
    }
    .student-item:hover {
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
      z-index: 100 !important;
    }
    
    .student-item.unanswered {
      background: #1e293b;
      border: 1px dashed #ef4444;
    }
    .student-item.unanswered .student-name {
      color: #fca5a5;
    }

    .name-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      margin: 4px 0 2px 0;
      padding: 0;
      width: 100%;
      box-sizing: border-box;
    }

    .name-wrapper {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .student-name {
      font-weight: bold;
      font-size: 1.15rem;
      color: #0f172a;
      white-space: nowrap;
      display: inline-block;
      transform-origin: left center;
      line-height: 1.1;
      margin: 0;
      padding: 0;
    }

    .report-icon {
      font-size: 0.55rem;
      background-color: #2563eb;
      color: #ffffff;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: bold;
      cursor: default;
      flex-shrink: 0;
      line-height: 1;
      border: 1px solid #1d4ed8;
      white-space: nowrap;
    }

    .unanswered-badge {
      font-size: 0.55rem;
      background-color: #7f1d1d;
      color: #fca5a5;
      padding: 1px 4px;
      border-radius: 2px;
      font-weight: bold;
      border: 1px solid #991b1b;
      line-height: 1;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .absent-badge {
      font-size: 0.55rem;
      background-color: #374151;
      color: #f3f4f6;
      padding: 1px 4px;
      border-radius: 2px;
      font-weight: bold;
      border: 1px solid #4b5563;
      line-height: 1;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .badge.official-absence-badge {
      background-color: #0284c7;
      color: #ffffff;
      border: 1px solid #38bdf8;
    }

    .student-item.official-absence {
      border: 1px dashed #38bdf8;
      background: #0f172a;
    }

    .badge-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }

    .timestamp {
      font-size: 0.55rem;
      color: #64748b;
      margin: 0 0 4px 0;
      padding: 0;
      line-height: 1;
    }
    .student-item.unanswered .timestamp {
      color: #cbd5e1;
    }

    .message {
      grid-row: 1 / -1;
      grid-column: 1 / -1;
      color: #94a3b8;
      text-align: center;
      padding: 20px;
    }

    .student-item.absent {
      background: #1f2937;
      border: 1px solid #4b5563;
      opacity: 0.65;
    }
    .student-item.absent .student-name {
      color: #9ca3af;
    }

    .duplicate-badge {
      font-size: 0.55rem;
      background-color: #b45309;
      color: #fef08a;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: bold;
      border: 1px solid #d97706;
      line-height: 1;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .student-item.has-duplicate {
      background: #2e2305 !important;
      border-color: #d97706 !important;
      animation: border-pulse-warning 2s infinite ease-in-out;
    }

    .student-item.has-duplicate .student-name {
      color: #fef08a !important;
    }

    .student-item.has-duplicate .timestamp {
      color: #ffffff !important;
      opacity: 0.9;
    }

    @keyframes border-pulse-warning {
      0% {
        border-color: #d97706;
        box-shadow: 0 0 4px rgba(217, 119, 6, 0.4);
      }
      50% {
        border-color: #f59e0b;
        box-shadow: 0 0 10px rgba(245, 158, 11, 0.7);
      }
      100% {
        border-color: #d97706;
        box-shadow: 0 0 4px rgba(217, 119, 6, 0.4);
      }
    }

    /* ツールチップ基本設定 */
    .student-item .detail-tooltip {
      visibility: hidden;
      opacity: 0;
      width: 220px;
      max-width: 85vw;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 0.72rem;
      border-radius: 6px;
      padding: 8px 10px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);

      position: absolute;
      z-index: 9999;
      top: 0;
      left: 100%;
      transform: translateX(6px);

      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
      pointer-events: none;
      box-sizing: border-box;
    }

    .student-item .detail-tooltip::after {
      content: "";
      position: absolute;
      top: 15px;
      right: 100%;
      border-width: 6px;
      border-style: solid;
      border-color: transparent #0f172a transparent transparent;
    }

    @media (hover: hover) and (pointer: fine) {
      .student-item:hover .detail-tooltip {
        visibility: visible;
        opacity: 1;
        transform: translateX(10px);
      }
    }

    .student-item.show-tooltip .detail-tooltip {
      visibility: visible;
      opacity: 1;
      transform: translateX(10px);
    }
    .student-item.show-tooltip {
      z-index: 100 !important;
    }

    .student-item .detail-tooltip.align-bottom {
      left: 0 !important;
      top: 100% !important;
      transform: translateY(6px) !important;
    }
    .student-item:hover .detail-tooltip.align-bottom,
    .student-item.show-tooltip.align-bottom .detail-tooltip {
      transform: translateY(10px) !important;
    }
    .student-item .detail-tooltip.align-bottom::after {
      top: auto !important;
      bottom: 100% !important;
      right: auto !important;
      left: 20px !important;
      transform: none !important;
      border-color: transparent transparent #0f172a transparent !important;
    }

    .student-item .detail-tooltip.align-top {
      left: 0 !important;
      top: auto !important;
      bottom: 100% !important;
      transform: translateY(-6px) !important;
    }
    .student-item:hover .detail-tooltip.align-top,
    .student-item.show-tooltip.align-top .detail-tooltip {
      transform: translateY(-10px) !important;
    }
    .student-item .detail-tooltip.align-top::after {
      top: 100% !important;
      bottom: auto !important;
      right: auto !important;
      left: 20px !important;
      transform: none !important;
      border-color: #0f172a transparent transparent transparent !important;
    }

    .tooltip-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
      line-height: 1.3;
    }
    .tooltip-row:last-child {
      margin-bottom: 0;
    }
    .tooltip-label {
      color: #94a3b8;
      font-weight: bold;
    }
    .tooltip-val {
      color: #e2e8f0;
    }

    @media (max-width: 768px) {
      body {
        padding: 4px;
      }
      .container {
        padding: 16px 8px;
        border-radius: 8px;
      }
      .header-status {
        flex-direction: column;
        align-items: flex-start;
      }
      .student-grid {
        display: grid;
        grid-template-rows: repeat(5, auto);
        grid-auto-flow: column;
        gap: 16px 8px;
        padding: 50px 12px;
        min-height: 320px;
        overflow-x: auto;
      }
      .student-item {
        max-width: 180px;
        width: 100%;
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
      border-color: #60a5fa;
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: #1f2937 #0b0f19;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-status">
    <h1 id="main-title">
      <span class="title-main">おさらいテスト 回答状況</span>
    </h1>
    
    <div class="header-right">
      <div class="date-info">
        判定基準日: <span id="current-date"></span> | 最終更新: <span id="last-update">-</span>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span> 自動更新中
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <div class="count-badge">表示人数: <span id="student-count">0</span> 名</div>

    <div class="controls-container">
      <div class="search-container">
        <!-- oninput イベント時に handleSearchInput を呼ぶよう変更 -->
        <input type="text" id="student-search" class="search-input" placeholder="🔍 あなたの名前を入力してください..." oninput="handleSearchInput()" autofocus>
      </div>
      <div class="usage-hint" id="usage-hint-text">※カードにマウスを合わせると詳細データが表示されます</div>

      <div class="lecture-buttons-container" id="lecture-buttons">
        <span class="lecture-label"><b>講義切替:</b></span>
      </div>
    </div>
  </div>

  <ul class="student-grid" id="student-list">
    <li class="message">名前を入力するとカードが表示されます。</li>
  </ul>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7qG7piMDI5I83ZTOb_udu67M4i-eGWa6PSaaVXH3ZRotYxHAmYj5_-5uQpS5-ymU/exec";
  const REFRESH_INTERVAL = 30000;
  const STORAGE_KEY = "saved_student_search_query"; // localStorage 用のキー

  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth() + 1;
  const day = today.getDate();
  const monthZero = String(month).padStart(2, '0');
  const dayZero = String(day).padStart(2, '0');
  const todayDateString = `${year}/${monthZero}/${dayZero}`;
  document.getElementById('current-date').textContent = todayDateString;

  let globalStudentsData = [];    
  let globalAttendeesData = [];  
  let globalLectures = [];
  let previousHash = "";
  let isRequesting = false;
  let selectedLecture = "ALL";

  function updateUsageHint() {
    const hintEl = document.getElementById('usage-hint-text');
    if (!hintEl) return;

    const isTouchDevice = (window.matchMedia("(pointer: coarse)").matches) || (window.innerWidth <= 768);
    
    if (isTouchDevice) {
      hintEl.textContent = "※カードをタップすると詳細データが表示されます";
    } else {
      hintEl.textContent = "※カードにマウスを合わせると詳細データが表示されます";
    }
  }

  function cleanStr(str) {
    return String(str || '').replace(/\s+/g, '').trim();
  }

  // ★ 検索欄の入力時にLocalStorageへ保存し、リストを更新する関数
  function handleSearchInput() {
    const searchInputEl = document.getElementById('student-search');
    if (searchInputEl) {
      try {
        localStorage.setItem(STORAGE_KEY, searchInputEl.value);
      } catch (e) {
        console.error("LocalStorage save error:", e);
      }
    }
    renderStudentList();
  }

  function fetchTodayData() {
    if (isRequesting) return;
    isRequesting = true;

    const oldScript = document.getElementById('jsonp-script');
    if (oldScript) oldScript.remove();

    const script = document.createElement('script');
    script.id = 'jsonp-script';
    script.src = `${GAS_WEB_APP_URL}?callback=handleResponse&_=${new Date().getTime()}`;
    
    script.onerror = () => {
      isRequesting = false;
      document.getElementById('last-update').textContent = "再接続中...";
    };

    document.body.appendChild(script);
  }

  function handleResponse(response) {
    isRequesting = false;
    const lastUpdateEl = document.getElementById('last-update');
    lastUpdateEl.textContent = new Date().toLocaleTimeString();

    if (response && response.error) {
      document.getElementById('student-list').innerHTML = `<li class="message" style="color:#f87171;">${escapeHtml(response.error)}</li>`;
      return;
    }

    if (response.hash && response.hash === previousHash) {
      return;
    }
    previousHash = response.hash;

    window.globalOfficialAbsences = (response && response.officialAbsences) ? response.officialAbsences : [];

    globalStudentsData = (response && response.students) ? response.students : [];
    
    let rawAttendees = (response && response.attendees) ? response.attendees : [];
    rawAttendees.sort((a, b) => {
      const timeA = a.time ? new Date(a.time).getTime() : 0;
      const timeB = b.time ? new Date(b.time).getTime() : 0;
      return timeA - timeB;
    });
    globalAttendeesData = rawAttendees;

    const rawLectures = (response && response.lectures) ? response.lectures : [];
    globalLectures = Array.from(new Set(rawLectures)).filter(lec => lec);

    renderStudentList();
  }

  function extractSubjectId(lectureStr) {
    if (!lectureStr || !lectureStr.includes('_')) return '';
    const parts = lectureStr.split('_');
    return parts[parts.length - 1].trim();
  }

  function renderStudentList() {
    const listEl = document.getElementById('student-list');
    const countEl = document.getElementById('student-count');
    
    const searchInputEl = document.getElementById('student-search');
    const searchQuery = searchInputEl ? cleanStr(searchInputEl.value).toLowerCase() : "";

    const mainTitleEl = document.getElementById('main-title');
    const pageTitleTag = document.getElementById('page-title-tag');
    const hasSubmissionsInTarget = globalStudentsData.length > 0;
      
    const baseTitleText = hasSubmissionsInTarget ? "おさらいテスト 回答状況" : "出席確認 回答状況";
    
    const dynamicTitleHtml = `
      <span class="title-main">${escapeHtml(baseTitleText)}</span>
      <span class="title-date">（${month}月${day}日分）</span>
    `;
    const dynamicTitlePlain = `${baseTitleText}（${month}月${day}日分）`;

    mainTitleEl.innerHTML = dynamicTitleHtml;
    pageTitleTag.textContent = dynamicTitlePlain;

    if (searchQuery === "") {
      countEl.textContent = "0";
      listEl.innerHTML = '<li class="message">名前を入力するとカードが表示されます。</li>';
      return;
    }

    let targetAttendees = [...globalAttendeesData];

    const officialAbsenceSet = new Set();
    const absenceData = window.globalOfficialAbsences || [];

    if (Array.isArray(absenceData)) {
      absenceData.forEach(abs => {
        if (abs.subjectId && abs.name) {
          const key = `${abs.subjectId}_${cleanStr(abs.name)}`;
          officialAbsenceSet.add(key);
        }
      });
    }

    if (Array.isArray(absenceData)) {
      absenceData.forEach(abs => {
        if (!abs.name || !abs.subjectId) return;

        const exists = targetAttendees.some(att => cleanStr(att.name) === cleanStr(abs.name));

        if (!exists) {
          targetAttendees.push({
            name: abs.name,
            lecture: `科目_${abs.subjectId}`,
            subjectId: abs.subjectId,       
            report: "公欠",                 
            isOfficialAbsence: true        
          });
        }
      });
    }

    const answeredMap = new Map();
    const responseCountMap = new Map();
    const activeLecturesWithResponses = new Set();

    globalStudentsData.forEach(s => {
      const lec = cleanStr(s.lecture);
      const name = cleanStr(s.name);
      
      if (lec && name) {
        const key = `${lec}_${name}`;
        const currentCount = responseCountMap.get(key) || 0;
        responseCountMap.set(key, currentCount + 1);

        answeredMap.set(key, s);
        activeLecturesWithResponses.add(lec);
      }
    });

    const uniqueAttendeesMap = new Map();
    const attendanceCountMap = new Map();
    const attendanceTimesMap = new Map();

    targetAttendees.forEach(att => {
      const key = `${cleanStr(att.lecture)}_${cleanStr(att.name)}`;
      attendanceCountMap.set(key, (attendanceCountMap.get(key) || 0) + 1);
      
      if (!attendanceTimesMap.has(key)) {
        attendanceTimesMap.set(key, []);
      }
      if (att.time) {
        attendanceTimesMap.get(key).push(escapeHtml(att.time));
      }

      if (!uniqueAttendeesMap.has(key)) {
        uniqueAttendeesMap.set(key, att);
      }
    });

    let uniqueAttendees = Array.from(uniqueAttendeesMap.values());

    uniqueAttendees = uniqueAttendees.filter(att => {
      const nameClean = cleanStr(att.name).toLowerCase();
      return nameClean === searchQuery;
    });

    countEl.textContent = uniqueAttendees.length;
    listEl.innerHTML = '';

    if (uniqueAttendees.length === 0) {
      listEl.innerHTML = '<li class="message">該当する回答データが見つかりませんでした。入力内容を確認してください。</li>';
      return;
    }

    uniqueAttendees.forEach(att => {
      const studentName = cleanStr(att.name);
      const studentLecture = cleanStr(att.lecture);
      const currentKey = `${studentLecture}_${studentName}`;

      const subjectId = extractSubjectId(studentLecture);
      const absenceKey = `${subjectId}_${studentName}`;
      const isOfficialAbsence = officialAbsenceSet.has(absenceKey);

      const answeredData = answeredMap.get(currentKey);
      
      const testResponseCount = responseCountMap.get(currentKey) || 0;
      const attendResponseCount = attendanceCountMap.get(currentKey) || 0;
      const maxCount = Math.max(testResponseCount, attendResponseCount);
      const isDuplicate = maxCount >= 2;

      const li = document.createElement('li');

      if (isOfficialAbsence) {
        li.classList.add('official-absence');
      }
      
      const reportText = String(att.report || "");
      const isAbsent = reportText.includes("欠席");

      const attendTimes = attendanceTimesMap.get(currentKey) || [];
      let attendTimeStr = '未登録';
      
      if (attendTimes.length === 1) {
        attendTimeStr = attendTimes[0];
      } else if (attendTimes.length > 1) {
        attendTimeStr = attendTimes.map(t => `<span class="time-item">${t}</span>`).join('<br>');
      }

      const testTimeStr = answeredData && answeredData.time ? escapeHtml(answeredData.time) : '未送信';
      
      let reportTimeStr = '未提出';
      if (answeredData && answeredData.hasReport) {
        reportTimeStr = answeredData.reportTimeStr ? escapeHtml(answeredData.reportTimeStr) : '提出済み';
      }

      let attendInfoRowsHtml = '';

      if (isOfficialAbsence) {
        attendInfoRowsHtml += `
          <div class="tooltip-row">
            <span class="tooltip-label">公欠処理:</span>
            <span class="tooltip-val">公欠登録済み</span>
          </div>
        `;
        if (attendTimes.length > 0) {
          attendInfoRowsHtml += `
            <div class="tooltip-row">
              <span class="tooltip-label">出席登録:</span>
              <span class="tooltip-val">${attendTimeStr}</span>
            </div>
          `;
        }
      } else {
        const attendLabel = isAbsent ? '欠席処理' : '出席登録';
        attendInfoRowsHtml += `
          <div class="tooltip-row">
            <span class="tooltip-label">${attendLabel}:</span>
            <span class="tooltip-val">${attendTimeStr}</span>
          </div>
        `;
      }

      const tooltipHtml = `
        <div class="detail-tooltip">
          <div class="tooltip-title">${escapeHtml(att.name)}</div>
          ${attendInfoRowsHtml}
          <div class="tooltip-row">
            <span class="tooltip-label">おさらいテスト:</span>
            <span class="tooltip-val">${testTimeStr}</span>
          </div>
          <div class="tooltip-row">
            <span class="tooltip-label">作業報告:</span>
            <span class="tooltip-val">${reportTimeStr}</span>
          </div>
        </div>
      `;

      if (isOfficialAbsence) {
        li.className = 'student-item official-absence';
        const displayOfficialTime = att.time ? `${escapeHtml(att.time)} 出席` : '公欠処理済み';

        li.innerHTML = `
          ${tooltipHtml}
          <div class="name-box">
            <div class="name-wrapper">
              <span class="student-name" style="color: #4ade80;" title="${escapeHtml(att.name)}">${escapeHtml(att.name)}</span>
            </div>
            <span class="official-badge" style="font-size: 11px; padding: 2px 6px; border-radius: 4px; background-color: #14532d; color: #4ade80; font-weight: bold; display: inline-block;">公欠</span>
          </div>
          <span class="timestamp">${displayOfficialTime}</span>
        `;
      }
      else if (isAbsent) {
        li.className = 'student-item absent';
        li.innerHTML = `
          ${tooltipHtml}
          <div class="name-box">
            <div class="name-wrapper">
              <span class="student-name" title="${escapeHtml(att.name)}">${escapeHtml(att.name)}</span>
            </div>
            <span class="absent-badge">欠席</span>
          </div>
          <span class="timestamp">欠席処理済み</span>
        `;
      }
      else if (answeredData) {
        li.className = 'student-item';

        let badgesHtml = '';
        if (isDuplicate) {
          badgesHtml += `<span class="duplicate-badge" title="${maxCount} 回送信されています">重複(${maxCount}) ⚠️</span>`;
        }

        const hasReportSubmitted = Boolean(answeredData.hasReport || answeredData.reportTimeStr);

        if (hasReportSubmitted) {
          const reportTitle = answeredData.reportTimeStr 
            ? `作業報告提出: ${escapeHtml(answeredData.reportTimeStr)}` 
            : '作業報告 提出済み';
            
          badgesHtml += `<span class="report-icon" title="${reportTitle}">報告 ⭐</span>`;
        }

        const timeDisplay = escapeHtml(answeredData.time);

        li.innerHTML = `
          ${tooltipHtml}
          <div class="name-box">
            <div class="name-wrapper">
              <span class="student-name" title="${escapeHtml(att.name)}">${escapeHtml(att.name)}</span>
            </div>
            <div class="badge-group">${badgesHtml}</div>
          </div>
          <span class="timestamp">${timeDisplay}</span>
        `;
      }
      else if (isDuplicate) {
        li.className = 'student-item has-duplicate';

        const badgesHtml = `<span class="duplicate-badge" title="${maxCount} 回送信されています">重複(${maxCount}) ⚠️</span>`;
        const timeDisplay = att.time ? `${escapeHtml(att.time)} 出席` : '回答済み';

        li.innerHTML = `
          ${tooltipHtml}
          <div class="name-box">
            <div class="name-wrapper">
              <span class="student-name" title="${escapeHtml(att.name)}">${escapeHtml(att.name)}</span>
            </div>
            ${badgesHtml}
          </div>
          <span class="timestamp">${timeDisplay} (最新)</span>
        `;
      } 
      else {
        li.className = 'student-item unanswered';
        const displayAttendTime = att.time ? `${escapeHtml(att.time)} 出席` : '未回答';
        const isLectureAllUnanswered = !activeLecturesWithResponses.has(studentLecture);
        const badgeHtml = isLectureAllUnanswered ? '' : `<span class="unanswered-badge">未回答</span>`;

        li.innerHTML = `
          ${tooltipHtml}
          <div class="name-box">
            <div class="name-wrapper">
              <span class="student-name" title="${escapeHtml(att.name)}">${escapeHtml(att.name)}</span>
            </div>
            ${badgeHtml}
          </div>
          <span class="timestamp">${displayAttendTime}</span>
        `;
      }

      listEl.appendChild(li);
    });

    listEl.querySelectorAll('.student-item').forEach(item => {
      const positionTooltip = () => {
        const tooltip = item.querySelector('.detail-tooltip');
        if (!tooltip) return;

        tooltip.classList.remove('align-bottom', 'align-top');

        const itemRect = item.getBoundingClientRect();
        const tooltipWidth = Math.min(220, window.innerWidth * 0.85);
        
        if (window.innerWidth - itemRect.right < tooltipWidth + 10) {
          const spaceBelow = window.innerHeight - itemRect.bottom;
          if (spaceBelow < 120) {
            tooltip.classList.add('align-top');
          } else {
            tooltip.classList.add('align-bottom');
          }
        }
      };

      item.addEventListener('click', (e) => {
        e.stopPropagation();
        positionTooltip();
        
        const isAlreadyShown = item.classList.contains('show-tooltip');
        
        document.querySelectorAll('.student-item.show-tooltip').forEach(el => {
          el.classList.remove('show-tooltip');
        });

        if (!isAlreadyShown) {
          item.classList.add('show-tooltip');
        }
      });
    });

    document.addEventListener('click', () => {
      document.querySelectorAll('.student-item.show-tooltip').forEach(el => {
        el.classList.remove('show-tooltip');
      });
    });

    setTimeout(() => {
      updateAllNameScales();
    }, 50);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
  }

  // ▼ 追加：±5秒（25秒〜35秒）のランダムなゆらぎを持たせて次回の自動更新を予約する関数
  function scheduleNextFetch() {
    const jitter = (Math.random() * 10000) - 5000; // -5000ms から +5000ms
    const currentInterval = BASE_REFRESH_INTERVAL + jitter;

    setTimeout(() => {
      fetchTodayData();
      scheduleNextFetch(); // 次回分を再予約
    }, currentInterval);
  }

  window.addEventListener('DOMContentLoaded', () => {
    // ★ ページ読み込み時に保存された検索キーワードを復元
    const searchInputEl = document.getElementById('student-search');
    if (searchInputEl) {
      try {
        const savedQuery = localStorage.getItem(STORAGE_KEY);
        if (savedQuery) {
          searchInputEl.value = savedQuery;
        }
      } catch (e) {
        console.error("LocalStorage load error:", e);
      }
    }

    updateUsageHint();
    fetchTodayData();
    
    // ▼ 変更：一定間隔の setInterval ではなく、ゆらぎ付きの自動更新を開始
    scheduleNextFetch();
  });

  window.addEventListener('resize', () => {
    updateUsageHint();
    updateAllNameScales();
  });

  function adjustNameScale(nameElement) {
    const wrapper = nameElement.parentElement;
    if (!wrapper) return;

    nameElement.style.transform = 'scaleX(1)';
    
    const availableWidth = wrapper.clientWidth;
    const textWidth = nameElement.scrollWidth;

    if (textWidth > 0 && availableWidth > 0 && textWidth > availableWidth) {
      const scale = Math.max(availableWidth / textWidth, 0.50);
      nameElement.style.transform = `scaleX(${scale.toFixed(4)})`;
    } else {
      nameElement.style.transform = 'scaleX(1)';
    }
  }

  function updateAllNameScales() {
    document.querySelectorAll('.student-name').forEach(adjustNameScale);
  }
</script>

</body>
</html>
